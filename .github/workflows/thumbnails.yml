name: Fetch video thumbnails

on:
  push:
    paths:
      - data/youtube-map.json
      - scripts/fetch_thumbs.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_thumbs.py
      - run: python scripts/build.py
      - name: Commit thumbnails and rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Add video thumbnails"
          git push
